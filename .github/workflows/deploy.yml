name: Build and deploy Smart Text Decoder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare dictionary data
        run: |
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt \
            -o words.txt
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/first20hours/google-10000-english/master/first_10000.txt \
            -o common-words.txt
          test -s words.txt
          test -s common-words.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
